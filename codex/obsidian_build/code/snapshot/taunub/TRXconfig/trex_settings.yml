# - NORMFACTORS - %
# --------------- %

NormFactors:
   - name: "SigXsecOverSM"
     Title: "#mu(signal)"
     Nominal: 1
     Min: 0
     Max: 10
     Samples: "ttbar_dilep"
     # Constant: True
     # Category: Theory

   - name: "top_Norm"
     Title: "#mu(top)"
     Nominal: 1
     Min: 0
     Max: 3
    #  Samples: "'ttbar','SingleTop','ttZ'"
     Samples: '"ttbar_dilep","SingleTop","ttZ"'

   - name: "Wjets_Norm"
     Title: "#mu(Wjets)"
     Nominal: 1
     Min: 0
     Max: 3
     Samples: "W*"


