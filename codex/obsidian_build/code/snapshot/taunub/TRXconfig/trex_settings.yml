# --------------- %
# --- REGIONS --- %
# --------------- %

Regions:
  - name: "SR_*"
    Type: SIGNAL
    # Variable: 1,1,0,1
    Ymax: 1e2
    Ymin: 1e-1
    LogScale: TRUE
    DataType: ASIMOV
  
  - name: "WCR_0tau1e0b_sch*"
    Type: CONTROL
    # Variable: 1,1,0,1
    Label: "0#tau1e0b, Resonance WCR"
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "WCR_0tau1mu0b_sch*"
    Type: CONTROL
    # Variable: 1,1,0,1
    Label: "0#tau1#mu0b, Resonance WCR"
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "WCR_0tau1e0b_tch*"
    Type: CONTROL
    # Variable: 1,1,0,1
    Label: "0#tau1e0b, Non-Resonance WCR"
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "WCR_0tau1mu0b_tch*"
    Type: CONTROL
    # Variable: 1,1,0,1
    Label: "0#tau1#mu0b, Non-Resonance WCR"
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "TopCR_1tau1e_sch*"
    Type: CONTROL
    # Variable: 1,1,0,1
    Label: "1#tau1e1b, Resonance topCR"
    Ymax: 1e3
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "TopCR_1tau1mu_sch*"
    Type: CONTROL
    # Variable: 1,1,0,1
    Label: "1#tau1#mu1b, Resonance topCR"
    Ymax: 1e3
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "TopCR_1tau1e_tch*"
    Type: CONTROL
    # Variable: 1,1,0,1
    Label: "1#tau1e1b, Non-Resonance topCR"
    Ymax: 1e3
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "TopCR_1tau1mu_tch*"
    Type: CONTROL
    # Variable: 1,1,0,1
    Label: "1#tau1#mu1b, Non-Resonance topCR"
    Ymax: 1e3
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

