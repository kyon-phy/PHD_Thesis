# --------------- %
# ---  JOB    --- %
# --------------- %

Job:
  # Name: "fit_taunub_nom_1l_allVR_N_minus_1"
  # Name: "fit_taunub_nom_1l_allVR"
  # Name: "fit_taunub_nom_1l_VR_test"
  Name: "fit_taunub_sys_1l_loose_CRVR_M2500"
  # Name: "fit_taunub"
  # # CmeLabel: "13 TeV"
  # POI: "gU_square"
  POI: "gU"
  # Label: "tau+x"
  LumiLabel: "140 fb^{-1}"
  # Lumi: XXX_LUMI
  PlotOptions: "NOSIG,YIELDS,OVERSIG" #,"CHI2","NOXERR","PREFITONPOSTFIT" #"NORMSIG","NOSIG"
  PlotLabel: "Internal"
  MCstatThreshold: 0.01
  # #UseGammasForCorr: TRUE
  # #GuessMCStatEmptyBins: FALSE
  # SystErrorBars: TRUE
  SystControlPlots: FALSE
  SystPruningShape: 0.01
  SystPruningNorm: 0.01
  # #SystLarge: 0.90
  SystCategoryTables: TRUE
  # CorrelationThreshold: 0.1
  # HistoChecks: NOCRASH
  PrePostFitCanvasSize: 800,600
  LegendX1: 0.46
  # #SplitHistoFiles: TRUE   # set this in order to have separated .root files in Histograms/ for different regions
  ImageFormat: "png" #,"eps","pdf"
  DoSummaryPlot: TRUE
  DoTables: TRUE
  # DoSignalRegionsPlot: TRUE
  DoPieChartPlot: TRUE
  # SummaryPlotYmin: 1
  SummaryPlotYmax: 1e5 #CRs
  LegendX1Summary: 0.35
  LegendX2Summary: 0.9
  RatioType: "DATAOVERBKG"
  RatioYmin: 0 #0.5
  RatioYmax: 2 #1.5
  # # RatioYtitle: "S/(S+B)"
  BlindingThreshold: 0.05
  BlindingType: SOVERB
  # ReplacementFile: /afs/cern.ch/work/z/zang/LQanalysis/TRExFitter_xTAU/TRExFitter/config/replacement_TauX_jiaqi.txt
  RankingMaxNP: 20
  # RankingPlot: Merge
  RankingPlot: All
  # DebugLevel: 2
  # #RemoveSystOnEmptySample: TRUE
  # #RemoveLargeSyst: TRUE
  # BlindingThreshold: 0.05
  # GetChi2: STAT
  BlindSRs: FALSE
  RatioYminPostFit: 0 #0.5
  RatioYmaxPostFit: 2 #1.5
  # StatOnly: True
  # # test options
  # #HideNP: SigXsecOverSM
  RecreateBinningFiles: True
  SmoothingOption: "MAXVARIATION"
  MergeUnderOverFlow: True
  UseGammaPulls: True

# --------------- %
# ---  FIT    --- %
# --------------- %

Fit:
   FitType: SPLUSB
  #  FitType: BONLY
   FitRegion: CRSR
  #  FitRegion: CRONLY
   FitBlind: False
   POIAsimov: 1
  #  UseMinos: "gU_square"
   UseMinos: "gU"
   #UseMinos: "gU_quad"
  #  UseMinos: all
   NumCPU: 8
  #  doLHscan: "gU_square"
   doLHscan: "gU"
  #  ToleranceScale: 0.01
   #DoNonProfileFit: True
   LHscanSteps: 20
  #  FitStrategy: 3


# --------------- %
# ---  LIMIT and Significance --- %
# --------------- %

BlocksToCopy:
  Limit:
    - name: "limit"
      LimitType: ASYMPTOTIC
      LimitBlind: FALSE
      SignalInjection: TRUE

  Significance:
    - name: "sig"
      SignificanceBlind: TRUE


# --------------- %
# --- REGIONS --- %
# --------------- %

Regions:
  - name: "SR_*"
    Type: SIGNAL
    Ymax: 1e2
    Ymin: 1e-1
    LogScale: TRUE
    Rebinning: 0,1500
    DataType: ASIMOV
    SkipSmoothing: TRUE
    Rebinning: 200,1200
    
  
