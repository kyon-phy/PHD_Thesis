#    LimitBlind: FALSE
#    SignalInjection: TRUE

# --------------- %
# --- REGIONS --- %
# --------------- %

Regions:
  - name: "SR_*sch*"
    Type: SIGNAL
    # Variable: 1,1,0,1
    Label: "Resonance SR"
    Ymax: 1e2
    Ymin: 1e-1
    LogScale: TRUE
    DataType: ASIMOV

  - name: "SR_*tch*"
    Type: SIGNAL
    # Variable: 1,1,0,1
    Label: "Non-Resonance SR"
    Ymax: 1e2
    Ymin: 1e-1
    LogScale: TRUE
    DataType: ASIMOV


