# --------------- %
# ---  FIT    --- %
# --------------- %

Fit:
   FitType: BONLY
   FitRegion: CRONLY
   FitBlind: True
   POIAsimov: 1
   UseMinos: SigXsecOverSM
   #NumCPU: 8
   doLHscan: all
   #DoNonProfileFit: True

