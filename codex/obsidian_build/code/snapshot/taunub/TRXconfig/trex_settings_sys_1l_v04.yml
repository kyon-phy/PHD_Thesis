# --------------- %
# ---  JOB    --- %
# --------------- %

Job:
  # Name: "fit_taunub_nom_1l_allVR_BONLY_MU1500_gU1_5_23L0_2_HadtauFixed"
  Name: "fit_taunub_sys_1l_allVR_SPLUSB_MU1500_gU1_5_23L0_2_alldecay_corrected"
  # Name: "fit_taunub"
  # # CmeLabel: "13 TeV"
  # POI: "gU_square"
  POI: "mu"
  Label: "Run-2"
  LumiLabel: "140 fb^{-1}"
  # Lumi: XXX_LUMI
  PlotOptions: "NOSIG,YIELDS,OVERSIG" #,"CHI2","NOXERR","PREFITONPOSTFIT" #"NORMSIG","NOSIG"
  PlotLabel: "Internal"
  MCstatThreshold: 0.01
  # #UseGammasForCorr: TRUE
  # #GuessMCStatEmptyBins: FALSE
  # SystErrorBars: TRUE
  SystControlPlots: False # set to false to disable the systematics/ folder to suppress the output file size
  SystPruningShape: 0.01
  SystPruningNorm: 0.01
  # #SystLarge: 0.90
  SystCategoryTables: TRUE 
  CorrelationThreshold: 0.2 # set to 0.1 to reduce the size of correlation matrix
  # HistoChecks: NOCRASH
  PrePostFitCanvasSize: 800,600
  LegendX1: 0.46
  # #SplitHistoFiles: TRUE   # set this in order to have separated .root files in Histograms/ for different regions
  ImageFormat: "pdf" #,"eps","pdf"
  DoSummaryPlot: TRUE
  DoTables: TRUE
  # DoSignalRegionsPlot: TRUE
  DoPieChartPlot: TRUE
  SummaryPlotYmax: 1e5 #CRs
  SummaryPlotYmin: 0.1 #CRs
  LegendX1Summary: 0.35
  LegendX2Summary: 0.9
  RatioType: "DATAOVERBKG"
  RatioYmin: 0 #0.5
  RatioYmax: 2 #1.5
  # # RatioYtitle: "S/(S+B)"
  BlindingThreshold: 0.05
  BlindingType: SOVERB
  # ReplacementFile: /afs/cern.ch/work/z/zang/LQanalysis/TRExFitter_xTAU/TRExFitter/config/replacement_TauX_jiaqi.txt
  RankingMaxNP: 20
  # RankingPlot: Merge
  RankingPlot: All
  # DebugLevel: 2
  # #RemoveSystOnEmptySample: TRUE
  # #RemoveLargeSyst: TRUE
  # BlindingThreshold: 0.05
  # GeNonResi2: STAT
  RatioYminPostFit: 0 #0.5
  RatioYmaxPostFit: 2 #1.5
  # StatOnly: True
  # # test options
  # #HideNP: SigXsecOverSM
  RecreateBinningFiles: True
  SmoothingOption: "MAXVARIATION"
  MergeUnderOverFlow: True
  UseGammaPulls: True
  SystCategoryTables: True
  CleanTables: TRUE
  # BlindSRs: FALSE
  BlindSRs: TRUE
  # NPRankingCanvasSize: 1100,1000
  # SuppressNegativeBinWarnings: True

# --------------- %
# ---  FIT    --- %
# --------------- %

Fit:
   FitType: SPLUSB
   FitRegion: CRSR
   POIAsimov: 1
  #  FitType: BONLY
  #  FitRegion: CRONLY
  #  POIAsimov: 0
   FitBlind: False
  #  UseMinos: "gU_square"
   UseMinos: "mu"
   #UseMinos: "gU_quad"
  #  UseMinos: all
   NumCPU: 8
  #  doLHscan: "gU_square"
   doLHscan: "mu"
  #  ToleranceScale: 0.01
   #DoNonProfileFit: True
   LHscanSteps: 20
  #  FitStrategy: 3


# --------------- %
# ---  LIMIT and Significance --- %
# --------------- %

BlocksToCopy:
  Limit:
    - name: "limit"
      POI: "mu"
      LimitType: ASYMPTOTIC
      LimitBlind: FALSE
      SignalInjection: TRUE
      SignalInjectionValue: 1

  Significance:
    - name: "sig"
      SignificanceBlind: TRUE
      POI: "mu"
      POIAsimov: 1


