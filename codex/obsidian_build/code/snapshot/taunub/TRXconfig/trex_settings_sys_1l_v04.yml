    Category: "Signal theory"
    CombineType: "STANDARDDEVIATION"
    CombineName: "Signal_PDF"
    numbering_sequence:
      - replacement_string: '#N'
        min: 1
        max: 9
    Regions: "SR*"

  - name: "Signal_theory_PDF"
    Title: "Signal Theory PDF #N"
    Samples: "MU1500_gU1_5_23L0_2_noWeights_bsm_Res,MU1500_gU1_5_23L0_2_noWeights_bsm_NonRes"
    HistoFolderNameUp: "GEN_MUR10_MUF10_PDF2608#N"
