# --------------- %
# ---  JOB    --- %
# --------------- %

Job:
  Name: "fit_taunub_sys"
  # Name: "fit_taunub"
  # # CmeLabel: "13 TeV"
  POI: "SigXsecOverSM"
  # Label: "tau+x"
  LumiLabel: "140 fb^{-1}"
  # Lumi: XXX_LUMI
  PlotOptions: "NOSIG,YIELDS,OVERSIG" #,"CHI2","NOXERR","PREFITONPOSTFIT" #"NORMSIG","NOSIG"
  PlotLabel: "Internal"
  # MCstatThreshold: 0.01
  # #UseGammasForCorr: TRUE
  # #GuessMCStatEmptyBins: FALSE
  # SystErrorBars: TRUE
  SystControlPlots: TRUE
  SystPruningShape: 0.005
  SystPruningNorm: 0.005
  # #SystLarge: 0.90
  # #SystCategoryTables: TRUE
  # #CorrelationThreshold: 0.20
  # HistoChecks: NOCRASH
  PrePostFitCanvasSize: 800,600
  LegendX1: 0.46
  # #SplitHistoFiles: TRUE   # set this in order to have separated .root files in Histograms/ for different regions
  ImageFormat: "png" #,"eps","pdf"
  DoSummaryPlot: TRUE
  DoTables: TRUE
  # DoSignalRegionsPlot: TRUE
  DoPieChartPlot: TRUE
  # SummaryPlotYmin: 1
  SummaryPlotYmax: 1e5 #CRs
  LegendX1Summary: 0.35
  LegendX2Summary: 0.9
  RatioType: "DATAOVERBKG"
  RatioYmin: 0.5 #0.5
  RatioYmax: 1.5 #1.5
  # # RatioYtitle: "S/(S+B)"
  # BlindingThreshold: 0.05
  # BlindingType: SOVERB
  # ReplacementFile: /afs/cern.ch/work/z/zang/LQanalysis/TRExFitter_xTAU/TRExFitter/config/replacement_TauX_jiaqi.txt
  # RankingMaxNP: 15
  # DebugLevel: 2
  # #RemoveSystOnEmptySample: TRUE
  # #RemoveLargeSyst: TRUE
  # BlindingThreshold: 0.05
  # GetChi2: STAT
  BlindSRs: FALSE
  RatioYminPostFit: 0 #0.5
  RatioYmaxPostFit: 2 #1.5
  # StatOnly: True
  # # test options
  # #HideNP: SigXsecOverSM
  RecreateBinningFiles: True
  # SmoothingOption: "MAXVARIATION"
  MergeUnderOverFlow: True
  UseGammaPulls: True

# --------------- %
# ---  FIT    --- %
# --------------- %

Fit:
  #  FitType: SPLUSB
   FitType: BONLY
  #  FitRegion: CRSR
   FitRegion: CRONLY
   FitBlind: False
   POIAsimov: 1
   UseMinos: "SigXsecOverSM"
  #  UseMinos: all
   NumCPU: 8
   doLHscan: all
   #DoNonProfileFit: True

# --------------- %
# ---  LIMIT  --- %
# --------------- %

#  Limit: "limit"
#    LimitType: ASYMPTOTIC
#    LimitBlind: FALSE
#    SignalInjection: TRUE

# --------------- %
# --- REGIONS --- %
# --------------- %

Regions:
  - name: "SR_*"
    Type: SIGNAL
    Ymax: 1e2
    Ymin: 1e-1
    LogScale: TRUE
    Rebinning: 0,1500
    DataType: ASIMOV
    
  
  - name: "WCR_0tau1e0b_sch*"
    Type: CONTROL
    Label: "0#tau1e0b, Resonance WCR"
    Ymax: 1e5
    Ymin: 1e-1
    Rebinning: 200,1200
    LogScale: TRUE
    DataType: DATA

  - name: "WCR_0tau1mu0b_sch*"
    Type: CONTROL
    Rebinning: 200,1200
    Label: "0#tau1#mu0b, Resonance WCR"
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "WCR_0tau1e0b_tch*"
    Type: CONTROL
    Rebinning: 200,1200
    Label: "0#tau1e0b, Non-Resonance WCR"
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "WCR_0tau1mu0b_tch*"
    Type: CONTROL
    Rebinning: 200,1200
    Label: "0#tau1#mu0b, Non-Resonance WCR"
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "topCR_1tau1e_sch*"
    Type: CONTROL
    Label: "1#tau1e1b, Resonance topCR"
    Ymax: 1e5
    Ymin: 1e-1
    Rebinning: 0,700
    LogScale: TRUE
    DataType: DATA

  - name: "topCR_1tau1mu_sch*"
    Type: CONTROL
    Rebinning: 0,700
    Label: "1#tau1#mu1b, Resonance topCR"
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "topCR_1tau1e_tch*"
    Type: CONTROL
    Rebinning: 0,700
    Label: "1#tau1e1b, Non-Resonance topCR"
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "topCR_1tau1mu_tch*"
    Type: CONTROL
    Rebinning: 0,700
    Label: "1#tau1#mu1b, Non-Resonance topCR"
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "WVR_0tau1e1b_sch*"
    Type: VALIDATION
    Label: "0#tau1e1b, Resonance 0tauVR"
    # Rebinning: 200,1200
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "WVR_0tau1mu1b_sch*"
    Type: VALIDATION
    Label: "0#tau1#mu1b, Resonance 0tauVR"
    # Rebinning: 200,1200
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "WVR_0tau1e1b_tch*"
    Type: VALIDATION
    Label: "0#tau1e1b, Non-Resonance 0tauVR"
    # Rebinning: 200,1200
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA

  - name: "WVR_0tau1mu1b_tch*"
    Type: VALIDATION
    Label: "0#tau1#mu1b, Non-Resonance 0tauVR"
    # Rebinning: 200,1200
    Ymax: 1e5
    Ymin: 1e-1
    LogScale: TRUE
    DataType: DATA


