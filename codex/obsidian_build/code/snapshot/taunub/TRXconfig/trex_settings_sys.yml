# --------------- %
# - NORMFACTORS - %
# --------------- %

NormFactors:
   - name: "SigXsecOverSM"
     Title: "#mu(signal_sch)"
     Nominal: 1
     Min: 0
     Max: 10
     Samples: "LQ_taunub_M1500"
    #  Constant: True
     Category: "Theory"
     Regions: "*sch*"

   - name: "top_Norm_tch"
     Title: "#mu(top_tch)"
     Nominal: 1
     Min: 0
     Max: 3
     Samples: ["tt*","SingleTop*"]
     Constant: False
     Category: "top"
     Regions: "*tch*"

   - name: "Wjets_Norm_tch"
     Title: "#mu(Wjets_tch)"
     Nominal: 1
     Min: 0
     Max: 3
     Constant: False
     Samples: "W*"
     Category: "W+jets"
     Regions: "*tch*"

   - name: "top_Norm_sch"
     Title: "#mu(top_sch)"
     Nominal: 1
     Min: 0
     Max: 3
     Samples: ["tt*","SingleTop*"]
     Constant: False
     Category: "top"
     Regions: "*sch*"

   - name: "Wjets_Norm_sch"
     Title: "#mu(Wjets_sch)"
     Nominal: 1
     Min: 0
     Max: 3
     Constant: False
     Samples: "W*"
     Category: "W+jets"
     Regions: "*sch*"


