# define regions
regions:
  - name: "SR_1tau0l1b_Res"
    selection: "flag_MET_decision_NOSYS && Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1 && Leptons_NOSYS.size() == 0 && nbJets85_NOSYS == 1 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 200 && Taus_NOSYS[0].Pt() * 1e-3 > 200 && Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 200 && Taus_NOSYS[0].InvM(bJets85_NOSYS[0]) * 0.001 > 800 && Jets_NOSYS.size() <= 4 && bJets85_pt_0_NOSYS * 1e-3 > 250"
    variables: &var_taunub
      - name: "met"
        title : ";E_{T}^{miss} [GeV];Events"
        definition: "MET_wpSet0_met_NOSYS * 0.001"
        type: "double"
        binning:
          bin_edges: [0, 5000]
          # min: 0
          # max: 1500
          # number_of_bins: 15
  - name: "SR_1tau0l1b_NonRes"
    selection: "flag_MET_decision_NOSYS && Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1 && Leptons_NOSYS.size() == 0 && nbJets85_NOSYS == 1 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 400 && Taus_NOSYS[0].Pt() * 1e-3 > 200 && Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 600 && abs(Taus_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2 && Jets_NOSYS.size() <= 2 && bJets85_pt_0_NOSYS * 1e-3 < 250 && bJets85_pt_0_NOSYS * 1e-3 > 50"
    variables: 
      - *var_taunub
  - name: "WCR_0tau1l0b_Res"
    selection: "flag_SLT_decision_NOSYS && Taus_NOSYS.size() == 0 && Leptons_NOSYS.size() == 1 && ((Leptons_NOSYS[0].is_electron() && Leptons_NOSYS[0].El().select_TightLH_HighPtCaloOnly_NOSYS() == 1) || (Leptons_NOSYS[0].is_muon() && Leptons_NOSYS[0].Mu().select_Medium_Tight_VarRad_NOSYS() == 1)) && globalTriggerMatchSLT_wpSet0_NOSYS == 1 && nbJets85_NOSYS == 0 && Jets_NOSYS.size() <= 4 && Jets_NOSYS.size() > 0 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 200 && Leptons_NOSYS[0].Pt() * 1e-3 > 200 && Leptons_NOSYS[0].mT(MET_NOSYS) * 0.001 > 200 && Leptons_NOSYS[0].InvM(Jets_NOSYS[0]) * 0.001 > 800 && Jets_NOSYS[0].Pt() * 1e-3 > 250"
    variables: &var_taunub_WCR
      - name: "met"
        title : ";E_{T}^{miss} [GeV];Events"
        definition: "MET_wpSet0_met_NOSYS * 0.001"
        type: "double"
        binning:
          bin_edges: [0, 5000]
          # bin_edges: [200, 300, 400, 500, 600, 1200]
  - name: "WCR_0tau1l0b_NonRes"
    selection: "flag_SLT_decision_NOSYS && Taus_NOSYS.size() == 0 && Leptons_NOSYS.size() == 1 && ((Leptons_NOSYS[0].is_electron() && Leptons_NOSYS[0].El().select_TightLH_HighPtCaloOnly_NOSYS() == 1) || (Leptons_NOSYS[0].is_muon() && Leptons_NOSYS[0].Mu().select_Medium_Tight_VarRad_NOSYS() == 1)) && globalTriggerMatchSLT_wpSet0_NOSYS == 1 && nbJets85_NOSYS == 0 && Jets_NOSYS.size() <= 2 && Jets_NOSYS.size() > 0 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 400 && Leptons_NOSYS[0].Pt() * 1e-3 > 200 && Leptons_NOSYS[0].mT(MET_NOSYS) * 0.001 > 600 && abs(Leptons_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2 && ((Jets_NOSYS[0].Pt() * 1e-3 < 250 && Jets_NOSYS[0].Pt() * 1e-3 > 50) || (Jets_NOSYS.size() > 1 ? (Jets_NOSYS[1].Pt() * 1e-3 < 250 && Jets_NOSYS[1].Pt() * 1e-3 > 50) : 0))"
    variables: 
      - *var_taunub_WCR
  - name: "topCR_1tau1l_Res"
    selection: "flag_SLT_decision_NOSYS && Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1 && Leptons_NOSYS.size() == 1 && ((Leptons_NOSYS[0].is_electron() && Leptons_NOSYS[0].El().select_TightLH_HighPtCaloOnly_NOSYS() == 1) || (Leptons_NOSYS[0].is_muon() && Leptons_NOSYS[0].Mu().select_Medium_Tight_VarRad_NOSYS() == 1)) && globalTriggerMatchSLT_wpSet0_NOSYS == 1 && nbJets85_NOSYS >= 1 && Jets_NOSYS.size() <= 4 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 100 && Taus_NOSYS[0].Pt() * 1e-3 > 100 && Leptons_NOSYS[0].Pt() * 1e-3 > 28 && Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 100 && bJets85_pt_0_NOSYS * 1e-3 > 250"
    variables: 
      - *var_taunub
    # variables: &var_taunub_TopCR
    #   - name: "met"
    #     title : ";E_{T}^{miss} [GeV];Events"
    #     definition: "MET_wpSet0_met_NOSYS * 0.001"
    #     type: "double"
    #     binning:
    #       bin_edges: [0., 2000]
    #       # bin_edges: [0., 50., 100., 150., 200., 400., 700., 1000.]
    #   - name: "tau_truth_ParticleType"
    #     title : ";Tau Truth Particle Type;Events"
    #     definition: "Taus_NOSYS[0].truth_ParticleType()"
    #     type: "float"
    #     binning:
    #       min: 0
    #       max: 6
    #       number_of_bins: 6
  - name: "topCR_1tau1l_NonRes"
    selection: "flag_SLT_decision_NOSYS && Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1 && Leptons_NOSYS.size() == 1 && ((Leptons_NOSYS[0].is_electron() && Leptons_NOSYS[0].El().select_TightLH_HighPtCaloOnly_NOSYS() == 1) || (Leptons_NOSYS[0].is_muon() && Leptons_NOSYS[0].Mu().select_Medium_Tight_VarRad_NOSYS() == 1)) && globalTriggerMatchSLT_wpSet0_NOSYS == 1 && nbJets85_NOSYS >= 1 && Jets_NOSYS.size() <= 2 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 100 && Taus_NOSYS[0].Pt() * 1e-3 > 100 && Leptons_NOSYS[0].Pt() * 1e-3 > 28 && Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 100 && bJets85_pt_0_NOSYS * 1e-3 < 250 && bJets85_pt_0_NOSYS * 1e-3 > 50 && abs(Taus_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2"
    variables: 
      - *var_taunub
      # - *var_taunub_TopCR
  - name: "VR_0tau1l1b_Res"
    selection: "flag_SLT_decision_NOSYS && Taus_NOSYS.size() == 0 && Leptons_NOSYS.size() == 1 && ((Leptons_NOSYS[0].is_electron() && Leptons_NOSYS[0].El().select_TightLH_HighPtCaloOnly_NOSYS() == 1) || (Leptons_NOSYS[0].is_muon() && Leptons_NOSYS[0].Mu().select_Medium_Tight_VarRad_NOSYS() == 1)) && globalTriggerMatchSLT_wpSet0_NOSYS == 1 && nbJets85_NOSYS == 1 && Jets_NOSYS.size() <= 4 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 200 && Leptons_NOSYS[0].Pt() * 1e-3 > 200 && Leptons_NOSYS[0].mT(MET_NOSYS) * 0.001 > 200 && Leptons_NOSYS[0].InvM(bJets85_NOSYS[0]) * 0.001 > 800 && bJets85_pt_0_NOSYS * 1e-3 > 250"
    variables: &var_taunub_0tauVR
      - name: "met_VR"
        title : ";E_{T}^{miss} [GeV];Events"
        definition: "MET_wpSet0_met_NOSYS * 0.001"
        type: "double"
        binning:
          bin_edges: [0, 5000]
          # bin_edges: [200, 300, 400, 500, 600, 1200]
      # - name: "lep_pt_0_VR"
      #   title : ";p_{T}^{l} [GeV];Events"
      #   definition: "Leptons_NOSYS.size()>0 ? Leptons_NOSYS[0].Pt() * 1e-3 : 0"
      #   type: "double"
      #   binning:
      #     bin_edges: [200., 300., 400., 600., 800., 1000.]
