# define regions for plots
regions:
  - name: "topCR_1tau1l_tch"
    selection: "flag_SLT_decision_NOSYS && Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1 && Leptons_NOSYS.size() == 1 && nbJets85_NOSYS >= 1"
    variables: &taunublepvariables
      - name: "tau_pt_0"
        title : ";Leading tau p_{T} [GeV];Events"
        definition: "Taus_NOSYS.size() > 0 ? Taus_NOSYS[0].Pt() * 0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 400
          number_of_bins: 20
      - name: "tauSF"
        title : ";tau Scale Factor;Events"
        definition: "tauSF_NOSYS"
        type: "float"
        binning:
          min: 0
          max: 2
          number_of_bins: 50
      - name: "muonSF"
        title : ";muon Scale Factor;Events"
        definition: "muonSF_NOSYS"
        type: "float"
        binning:
          min: 0.9
          max: 1.1
          number_of_bins: 50
      - name: "elSF"
        title : ";electron Scale Factor;Events"
        definition: "elSF_NOSYS"
        type: "float"
        binning:
          min: 0.9
          max: 1.1
          number_of_bins: 50
      - name: "jetSF"
        title : ";jetSF;Events"
        definition: "jetSF_NOSYS"
        type: "float" 
        binning:
          min: 0.95
          max: 1.05
          number_of_bins: 50
      - name: "TriggerSF"
        title : ";SLT EffSF;Events"
        definition: "globalTriggerEffSFSLT_wpSet0_NOSYS"
        type: "float"
        binning:
          min: 0.9
          max: 1.1
          number_of_bins: 50
      # - name: "NNLO_reweight"
      #   title : ";weight_NNLO_3D_NOSYS;Events"
      #   definition: "weight_NNLO_3D_NOSYS"
      #   type: "double"
      #   binning:
      #     min: 0.5
      #     max: 1.5
      #     number_of_bins: 50
      - name: "bJets85_pt_0"
        title : ";bJets85_0 p_{T} [GeV];Events"
        definition: "nbJets85_NOSYS > 0 ? bJets85_pt_0_NOSYS * 1e-3 : 0"
        type: "double"
        binning:
          min: 0
          max: 1000
          number_of_bins: 40
      - name: "weight_ftag_effSF_GN2v01_Continuous"
        title : ";ftag_effSF_GN2v01_Continuous_NOSYS;Events"
        definition: "weight_ftag_effSF_GN2v01_Continuous_NOSYS"
        type: "float"
        binning:
          min: 0.5
          max: 1.5
          number_of_bins: 50
      - name: "Mtaub"
        title : ";M_{taub} [GeV];Events"
        definition: "Taus_NOSYS.size() > 0 ? Taus_NOSYS[0].InvM(bJets85_NOSYS[0]) * 0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 1000
          number_of_bins: 50
      - name: "Mtaumet"
        title : ";M_{taumet} [GeV];Events"
        definition: "Taus_NOSYS.size() > 0 ? Taus_NOSYS[0].InvM(MET_NOSYS) * 0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 1000
          number_of_bins: 50
      - name: "mT_tau_met"
        title : ";m_{T}(tau, met);Events"
        definition: "Taus_NOSYS.size() > 0 ? Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 1000
          number_of_bins: 50
      - name: "tau_met_deltaphi"
        title : ";#Delta#phi(tau, met);Events"
        definition: "Taus_NOSYS.size() > 0 ? abs(Taus_NOSYS[0].DeltaPhi(MET_NOSYS)) : 0"
        type: "double"
        binning:
          min: 0
          max: 3.2
          number_of_bins: 50
      - name: "flag_minDPhi"
        title : ";flag_minDPhi;Events"
        definition: "flag_minDPhi_NOSYS"
        type: "bool"
        binning:
          min: 0
          max: 2
          number_of_bins: 2
          number_of_bins: 8
      - name: "jet_pt_0"
        title : ";p_{T}^{jet0} [GeV];Events"
        definition: "Jets_NOSYS.size()>0 ? Jets_NOSYS[0].Pt() * 1e-3 : 0"
        type: "double"
        binning:
          min: 0
          max: 1500
          number_of_bins: 15
      - name: "TriggerMatch_flag"
        title : ";TriggerMatch flag;Events"
        definition: "globalTriggerMatchSLT_wpSet0_NOSYS == 1 ? 1 : 0"
        type: "int"
        binning:
          min: 0
          max: 2
          number_of_bins: 2
      - name: "truth_met"
        title : ";truth met;Events"
        definition: "PL_MET_met * 1e-3"
        type: "double"
        binning:
          min: 0
          max: 1000
          number_of_bins: 50
      - name: "truth_tau_pt"
        title : ";truth tau p_{T};Events"
        definition: "PL_tau_pt.size() > 0 ? PL_tau_pt[0] * 1e-3 : 0"
        type: "double"
        binning:
          min: 0
          max: 1000
          number_of_bins: 50
  # - name: "WCR_0tau1e0b_tch"
  #   selection: "flag_SLT_decision_NOSYS && Taus_NOSYS.size() == 0 && Leptons_NOSYS.size() == 1 && Leptons_NOSYS[0].is_electron() && Leptons_NOSYS[0].El().select_TightLH_HighPtCaloOnly_NOSYS() == 1 && nbJets85_NOSYS == 0 && Jets_NOSYS.size() <= 2 && Jets_NOSYS.size() > 0 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 400 && Leptons_NOSYS[0].Pt() * 1e-3 > 200 && Leptons_NOSYS[0].mT(MET_NOSYS) * 0.001 > 600 && abs(Leptons_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2 && Jets_NOSYS[0].Pt() * 1e-3 < 250 && Jets_NOSYS[0].Pt() * 1e-3 > 50"
  #   variables: 
  #     - *taunublepvariables
  # - name: "WCR_0tau1mu0b_tch"
  #   selection: "flag_SLT_decision_NOSYS && Taus_NOSYS.size() == 0 && Leptons_NOSYS.size() == 1 && Leptons_NOSYS[0].is_muon() && Leptons_NOSYS[0].Mu().select_Medium_NonIso_NOSYS() == 1 && nbJets85_NOSYS == 0 && Jets_NOSYS.size() <= 2 && Jets_NOSYS.size() > 0 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 400 && Leptons_NOSYS[0].Pt() * 1e-3 > 200 && Leptons_NOSYS[0].mT(MET_NOSYS) * 0.001 > 600 && abs(Leptons_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2 && Jets_NOSYS[0].Pt() * 1e-3 < 250 && Jets_NOSYS[0].Pt() * 1e-3 > 50"
  #   variables: 
  #     - *taunublepvariables
  - name: "Wtaunu_test"
    selection: "flag_SLT_decision_NOSYS && Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1 && Leptons_NOSYS.size() == 1 && ((Leptons_NOSYS[0].is_electron() && Leptons_NOSYS[0].El().select_TightLH_HighPtCaloOnly_NOSYS() == 1) || (Leptons_NOSYS[0].is_muon() && Leptons_NOSYS[0].Mu().select_Medium_NonIso_NOSYS() == 1)) && globalTriggerMatchSLT_wpSet0_NOSYS == 1"
    variables: &Wtaunu_test
      - name: "tau_pt_0"
        title : ";Leading tau p_{T} [GeV];Events"
        definition: "Taus_NOSYS.size() > 0 ? Taus_NOSYS[0].Pt() * 0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 1000
          number_of_bins: 40
      - name: "met"
        title : ";E_{T}^{miss} [GeV];Events"
        definition: "MET_wpSet0_met_NOSYS * 0.001"
        type: "double"
        binning:
          min: 0
          max: 1000
          number_of_bins: 40
      - name: "truth_met"
        title : ";truth met;Events"
        definition: "PL_MET_met * 1e-3"
        type: "double"
        binning:
          min: 0
          max: 1000
          number_of_bins: 50
      - name: "truth_tau_pt"
        title : ";truth tau p_{T};Events"
        definition: "PL_tau_pt.size() > 0 ? PL_tau_pt[0] * 1e-3 : 0"
        type: "double"
        binning:
          min: 0
          max: 1000
          number_of_bins: 50


