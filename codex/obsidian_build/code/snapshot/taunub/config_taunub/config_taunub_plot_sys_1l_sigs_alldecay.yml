    selection: "flag_MET_decision_NOSYS && Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1 && Leptons_NOSYS.size() == 0 && nbJets85_NOSYS == 2 && Jets_NOSYS.size() <= 2 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 200 && Taus_NOSYS[0].Pt() * 1e-3 > 100 && Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 200 && abs(Taus_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2 && ((bJets85_NOSYS[0].Pt() * 1e-3 < 250 && bJets85_NOSYS[0].Pt() * 1e-3 > 50) || (bJets85_NOSYS[1].Pt() * 1e-3 < 250 && bJets85_NOSYS[1].Pt() * 1e-3 > 50))"
    variables: 
      - *var_taunub_topVR
  - name: "SR_1tau0l1b_sch_looseInvM" # Mtaub > 800 GeV --> 0 GeV
    selection: "flag_MET_decision_NOSYS && Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1 && Leptons_NOSYS.size() == 0 && nbJets85_NOSYS == 1 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 200 && Taus_NOSYS[0].Pt() * 1e-3 > 200 && Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 200 && Jets_NOSYS.size() <= 4 && bJets85_pt_0_NOSYS * 1e-3 > 250"
    variables: &var_taunub_looseInvMtaub
      - name: "Mtaub"
        title : ";M_{tau+b} [GeV];Events"
        definition: "Taus_NOSYS.size() > 0 ? Taus_NOSYS[0].InvM(bJets85_NOSYS[0]) * 0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 2000
          number_of_bins: 80
  - name: "SR_1tau0l_tch_looseNbjets" #  nbjets = 1 --> none, b jet pt (50,250) --> none
    selection: "flag_MET_decision_NOSYS && Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1 && Leptons_NOSYS.size() == 0 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 400 && Taus_NOSYS[0].Pt() * 1e-3 > 200 && Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 600 && abs(Taus_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2 && Jets_NOSYS.size() <= 2"
    variables: &var_taunub_looseMET_looseNbjets
      - name: "met"
        title : ";E_{T}^{miss} [GeV];Events"
        definition: "MET_wpSet0_met_NOSYS * 0.001"
        type: "double"
        binning:
          min: 0
          max: 2000
          number_of_bins: 80
      - name: "Njets"
        title : ";Number of jets;Events"
        definition: "Jets_NOSYS.size()"
        type: "unsigned long"
        binning:
          min: 0
          max: 5
          number_of_bins: 5


