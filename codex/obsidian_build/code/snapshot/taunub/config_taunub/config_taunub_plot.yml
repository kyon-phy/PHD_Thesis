        title: "SLT trigger"
      - selection: "Leptons_NOSYS.size() == 1 && Leptons_NOSYS[0].is_muon() && Leptons_NOSYS[0].Mu().select_Medium_NonIso_NOSYS() == 1 && globalTriggerMatchSLT_wpSet0_NOSYS == 1"
        title: "trigger matched medium muon"
      - selection: "Taus_NOSYS.size() == 0"
        title: "tau veto"
      - selection: " nbJets85_NOSYS == 0"
        title: "b veto"
      - selection: "Jets_NOSYS.size() <= 2 && Jets_NOSYS.size() > 0"
        title: "njet_1_2"
      - selection: "flag_minDPhi_NOSYS"
        title: "QCD cut"
      - selection: "MET_wpSet0_met_NOSYS * 1e-3 > 400"
        title: "met_400"
      - selection: "Leptons_NOSYS[0].Pt() * 1e-3 > 200"
        title: "lep0_pt_200"
      - selection: "Leptons_NOSYS[0].mT(MET_NOSYS) * 0.001 > 600"
        title: "lep0_mT_600"
      - selection: "abs(Leptons_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2"
        title: "lep0_dphi_1.2"
      - selection: "Jets_NOSYS[0].Pt() * 1e-3 < 250 && Jets_NOSYS[0].Pt() * 1e-3 > 50"
        title: "jet0_pt_50_250"

  - name: "WCR_0tau1e0b_sch"
    samples: ["ttbar_dilep", "ttZ", "SingleTop", "Ztautau", "Wtaunu_METTAU", "Wtaunu_HF", "Wlnu", "Diboson", "Diboson_semiLep", "Zll", "Znunu", "Zjet_EWK", "Dijet", "Data"]
