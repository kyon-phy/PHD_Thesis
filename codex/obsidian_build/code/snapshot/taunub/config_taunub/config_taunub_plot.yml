        title: "njet_4"
      - selection: "flag_minDPhi_NOSYS"
        title: "QCD cut"
      - selection: "MET_wpSet0_met_NOSYS * 1e-3 > 200"
        title: "met_200"
      - selection: "Leptons_NOSYS[0].Pt() * 1e-3 > 200"
        title: "lep0_pt_200"
      - selection: "Leptons_NOSYS[0].mT(MET_NOSYS) * 0.001 > 200"
        title: "lep0_mT_200"
      - selection: "Leptons_NOSYS[0].InvM(Jets_NOSYS[0]) * 0.001 > 800"
        title: "Mlep0jet0_800"
      - selection: "Jets_NOSYS[0].Pt() * 1e-3 > 250"
        title: "jet0_pt_250"

  - name: "WCR_0tau1mu0b_sch"
    samples: ["ttbar_dilep", "ttZ", "SingleTop", "Ztautau", "Wtaunu_METTAU", "Wtaunu_HF", "Wlnu", "Diboson", "Diboson_semiLep", "Zll", "Znunu", "Zjet_EWK", "Dijet", "Data"]
    # variables_to_track: ["lep_pt_0","mT_lep0_met","lep0_met_deltaphi","jet_pt_0","nJets"]
    selections:
      - selection: "flag_SLT_decision_NOSYS"
