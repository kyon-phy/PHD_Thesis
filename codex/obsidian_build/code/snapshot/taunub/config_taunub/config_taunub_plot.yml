# define ntuples
ntuples:
  # regions: ["WCR_0tau1mu0b_tch", "WCR_0tau1e0b_tch"] 
  regions: ["WCR_0tau1mu0b_sch", "WCR_0tau1e0b_sch"] 
  samples: ["Data", "Diboson", "Diboson_semiLep", "Wlnu"]
  branches: ["eventNumber", "weight_total_NOSYS", "jet_pt_NOSYS", "jet_select_wpSet0_NOSYS", "tauSF_NOSYS", "muonSF_NOSYS", "elSF_NOSYS", "lumi", "xSection", "jetSF_NOSYS", "weight_ftag_effSF_GN2v01_Continuous_NOSYS", "globalTriggerEffSFSLT_wpSet0_NOSYS", "globalTriggerMatchSLT_wpSet0_NOSYS"]

# define regions
regions:
  - name: "SR_1tau0l1b_sch"
    selection: "flag_MET_decision_NOSYS && Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1 && Leptons_NOSYS.size() == 0 && nbJets85_NOSYS == 1 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 200 && Taus_NOSYS[0].Pt() * 1e-3 > 200 && Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 200 && Taus_NOSYS[0].InvM(bJets85_NOSYS[0]) * 0.001 > 800 && Jets_NOSYS.size() <= 4 && bJets85_pt_0_NOSYS * 1e-3 > 250"
    variables: &var_taunub
      - name: "tau_pt_0"
        title : ";p_{T}^{#tau} [GeV];Events"
        definition: "Taus_NOSYS.size()>0 ? Taus_NOSYS[0].Pt() * 0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 1500
          number_of_bins: 15
      - name: "lep_pt_0"
        title : ";p_{T}^{l} [GeV];Events"
        definition: "Leptons_NOSYS.size()>0 ? Leptons_NOSYS[0].Pt() * 0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 1500
          number_of_bins: 15
      - name: "met"
        title : ";E_{T}^{miss} [GeV];Events"
        definition: "MET_wpSet0_met_NOSYS * 0.001"
        type: "double"
        binning:
          min: 0
          max: 1500
          number_of_bins: 15
      - name: "bjet_pt_0"
        title : ";p_{T}^{b} [GeV];Events"
        definition: "nbJets85_NOSYS>0 ? bJets85_pt_0_NOSYS * 1e-3 : 0"
        type: "double"
        binning:
          min: 0
          max: 1500
          number_of_bins: 15
      - name: "jet_pt_0"
        title : ";p_{T}^{jet0} [GeV];Events"
        definition: "Jets_NOSYS.size()>0 ? Jets_NOSYS[0].Pt() * 1e-3 : 0"
        type: "double"
        binning:
          min: 0
          max: 1500
          number_of_bins: 15
      - name: "mT_tau_met"
        title : ";m_{T}(#tau, met) [GeV];Events"
        definition: "Taus_NOSYS.size()>0 ? Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 1500
          number_of_bins: 15
      - name: "mT_lep0_met"
        title : ";m_{T}(l, met) [GeV];Events"
        definition: "Leptons_NOSYS.size()>0 ? Leptons_NOSYS[0].mT(MET_NOSYS) * 0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 1500
          number_of_bins: 15
      - name: "Mbtau"
        title : ";M_(#tau+b) [GeV];Events"
        definition: "Taus_NOSYS.size()>0 && nbJets85_NOSYS > 0 ? Taus_NOSYS[0].InvM(bJets85_NOSYS[0]) * 0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 2500
          number_of_bins: 25
      - name: "Mlep0B"
        title : ";M_(b+l) [GeV];Events"
        definition: "nbJets85_NOSYS>0 && Leptons_NOSYS.size()>0 ? bJets85_NOSYS[0].InvM(Leptons_NOSYS[0])*0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 2500
          number_of_bins: 25
      - name: "MJetTau"
        title : ";M_(#tau+jet) [GeV];Events"
        definition: "Taus_NOSYS.size()>0 && Jets_NOSYS.size() > 0 ? Taus_NOSYS[0].InvM(Jets_NOSYS[0]) * 0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 2500
          number_of_bins: 25
      - name: "Mlep0Jet"
        title : ";M_(l+jet0) [GeV];Events"
        definition: "Jets_NOSYS.size() > 0 && Leptons_NOSYS.size()>0 ? Jets_NOSYS[0].InvM(Leptons_NOSYS[0])*0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 2500
          number_of_bins: 25
      - name: "nbJets85"
        title : ";Number of b jets;Events"
        definition: "nbJets85_NOSYS"
        type: "unsigned int"
        binning:
          min: 0
          max: 4
          number_of_bins: 4
      - name: "nJets"
        title : ";Number of jets;Events"
        definition: "Jets_NOSYS.size()"
        type: "unsigned long"
        binning:
          min: 0
          max: 6
          number_of_bins: 6
      - name: "tau_met_deltaphi"
        title : ";#Delta#phi(#tau, met);Events"
        definition: "Taus_NOSYS.size()>0 ? abs(Taus_NOSYS[0].DeltaPhi(MET_NOSYS)) : 0"
        type: "double"
        binning:
          min: 0
          max: 3.2
          number_of_bins: 8
      - name: "lep0_met_deltaphi"
        title : ";#Delta#phi(lep0, met);Events"
        definition: "Leptons_NOSYS.size()>0 ? abs(Leptons_NOSYS[0].DeltaPhi(MET_NOSYS)) : 0"
        type: "double"
        binning:
          min: 0
          max: 3.2
          number_of_bins: 8
      - name: "flag_minDPhi"
        title : ";flag_minDPhi_{met, jet};Events"
        definition: "flag_minDPhi_NOSYS"
        type: "bool"
        binning:
          min: 0
          max: 2
          number_of_bins: 2
  - name: "SR_1tau0l1b_tch"
    selection: "flag_MET_decision_NOSYS && Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1 && Leptons_NOSYS.size() == 0 && nbJets85_NOSYS == 1 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 400 && Taus_NOSYS[0].Pt() * 1e-3 > 200 && Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 600 && abs(Taus_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2 && Jets_NOSYS.size() <= 2 && bJets85_pt_0_NOSYS * 1e-3 < 250 && bJets85_pt_0_NOSYS * 1e-3 > 50"
    variables: 
      - *var_taunub
  - name: "WCR_0tau1e0b_tch"
    selection: "flag_SLT_decision_NOSYS && Taus_NOSYS.size() == 0 && Leptons_NOSYS.size() == 1 && Leptons_NOSYS[0].is_electron() && Leptons_NOSYS[0].El().select_TightLH_HighPtCaloOnly_NOSYS() == 1 && globalTriggerMatchSLT_wpSet0_NOSYS == 1 && nbJets85_NOSYS == 0 && Jets_NOSYS.size() <= 2 && Jets_NOSYS.size() > 0 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 400 && Leptons_NOSYS[0].Pt() * 1e-3 > 200 && Leptons_NOSYS[0].mT(MET_NOSYS) * 0.001 > 600 && abs(Leptons_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2 && Jets_NOSYS[0].Pt() * 1e-3 < 250 && Jets_NOSYS[0].Pt() * 1e-3 > 50"
    # selection: "flag_SLT_decision_NOSYS && Taus_NOSYS.size() == 0 && Leptons_NOSYS.size() == 1 && Leptons_NOSYS[0].is_electron() && Leptons_NOSYS[0].El().select_TightLH_HighPtCaloOnly_NOSYS() == 1 && nbJets85_NOSYS == 0 && Jets_NOSYS.size() <= 2 && Jets_NOSYS.size() > 0 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 400 && Leptons_NOSYS[0].Pt() * 1e-3 > 200 && Leptons_NOSYS[0].mT(MET_NOSYS) * 0.001 > 600 && abs(Leptons_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2" # wo jet pt cut
    variables: &var_taunub_WCR
      - name: "lep_pt_0"
        title : ";p_{T}^{l} [GeV];Events"
        definition: "Leptons_NOSYS.size()>0 ? Leptons_NOSYS[0].Pt() * 0.001 : 0"
        type: "double"
        binning:
          bin_edges: [100, 200, 300, 500, 600, 1200]
          # min: 0
          # max: 1500
          # number_of_bins: 15
      - name: "met"
        title : ";E_{T}^{miss} [GeV];Events"
        definition: "MET_wpSet0_met_NOSYS * 0.001"
        type: "double"
        binning:
          bin_edges: [200, 300, 400, 500, 600, 1200]
          # min: 0
          # max: 1500
          # number_of_bins: 15
      - name: "jet_pt_0"
        title : ";p_{T}^{jet0} [GeV];Events"
        definition: "Jets_NOSYS.size()>0 ? Jets_NOSYS[0].Pt() * 1e-3 : 0"
        type: "double"
        binning:
          bin_edges: [0, 50, 150, 250, 350, 450, 550, 650, 750, 1000]
          # min: 0
          # max: 250
          # number_of_bins: 25
      - name: "bjet_pt_0"
        title : ";p_{T}^{b} [GeV];Events"
        definition: "nbJets85_NOSYS>0 ? bJets85_pt_0_NOSYS * 1e-3 : 0"
        type: "double"
        binning:
          bin_edges: [0., 50., 100., 150., 200., 250., 300., 500., 700.]
      - name: "mT_lep0_met"
        title : ";m_{T}(l, met) [GeV];Events"
        definition: "Leptons_NOSYS.size()>0 ? Leptons_NOSYS[0].mT(MET_NOSYS) * 0.001 : 0"
        type: "double"
        binning:
