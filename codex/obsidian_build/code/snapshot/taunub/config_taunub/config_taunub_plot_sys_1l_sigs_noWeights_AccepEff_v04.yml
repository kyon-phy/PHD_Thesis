general:
  debug_level: DEBUG

  # paths
  # input_filelist_path: "/afs/cern.ch/work/z/zang/LQanalysis/taux_fastframes/input/filelist_v04.txt"
  # input_sumweights_path: "/afs/cern.ch/work/z/zang/LQanalysis/taux_fastframes/input/sum_of_weights_v04.txt"
  input_filelist_path: "/afs/cern.ch/work/z/zang/LQanalysis/taux_fastframes/input/filelist_v04_sig_noPreselection.txt"
  input_sumweights_path: "/afs/cern.ch/work/z/zang/LQanalysis/taux_fastframes/input/sum_of_weights_v04_sig_noPreselection.txt"
  # output_path_histograms: "/afs/cern.ch/work/z/zang/LQanalysis/taux_fastframes/run/output_plots/taunub_sys_1l_allVR_with_beamspot_v04_sig_CutFlow_wSFs"
  output_path_histograms: "/afs/cern.ch/work/z/zang/LQanalysis/taux_fastframes/run/output_plots/taunub_sys_1l_allVR_with_beamspot_v05_sig_Acceptance_Eff"
  output_path_ntuples: "./output_ntuples/taunub/sigs_cutflow/"

  # weights
  default_sumweights: "NOSYS"
  # default_event_weights: "weight_mc_NOSYS * weight_pileup_NOSYS * weight_beamspot * tauSF_NOSYS * elSF_NOSYS * muonSF_NOSYS * jetSF_NOSYS * weight_ftag_effSF_GN2v01_Continuous_NOSYS * globalTriggerEffSFSLT_wpSet0_NOSYS" # reco event weights. (=SFs*Xsec*Event_weight/SumOfWeights)
  default_event_weights: "weight_mc_NOSYS" # pure reco event weights for cutflow counting. (=Xsec*Event_weight/SumOfWeights)
  # default_event_weights: "sumWeights_NOSYS/(lumi*xSection)" # weight scaled to count raw number of events
  # default_event_weights: "weight_mc_NOSYS * weight_pileup_NOSYS * weight_beamspot * tauSF_NOSYS * elSF_NOSYS * muonSF_NOSYS * jetSF_NOSYS * weight_ftag_effSF_GN2v01_Continuous_NOSYS * globalTriggerEffSFSLT_wpSet0_NOSYS/(140000*xSection)" # Acceptance * Efficiency. (=N_reco/(Xsec*FilterEff*luminosity))
  # default_event_weights: "weight_mc_NOSYS * weight_pileup_NOSYS * weight_beamspot * tauSF_NOSYS * elSF_NOSYS * muonSF_NOSYS * jetSF_NOSYS * weight_ftag_effSF_GN2v01_Continuous_NOSYS * globalTriggerEffSFSLT_wpSet0_NOSYS/140000" # Xsec * Acceptance * Efficiency. (=Xsec*N_reco/(Xsec*FilterEff*luminosity))

  # overwrite_event_weights: True
  default_reco_tree_name: "reco"

  # path to the file with cross-sections
  xsection_files:
    # - files: ["/cvmfs/atlas.cern.ch/repo/sw/database/GroupData/dev/PMGTools/PMGxsecDB_mc16.txt"]
    - files: ["/afs/cern.ch/work/z/zang/LQanalysis/taux_fastframes/PMGxsecDB_mc16.txt"]
      campaigns: ["mc20a","mc20d","mc20e"]

  # # name of the custom class
  custom_frame_name: "TauXFastFrame"

  # automatic systematics?
  # automatic_systematics: True
  # nominal_only: False
  automatic_systematics: False
  nominal_only: True
  # exclude_systematics: ["EL.*", "MUON.*", "MET.*", "JET.*", "EG.*", "FT_EFF.*", "PRW.*", "TAUS.*"] # include Theory systematics
  # exclude_systematics: ["EL.*", "MUON.*", "MET.*", "EG.*", "TAUS.*", "FT_EFF.*"] # Theory, PRW AND JET uncertainties
  # exclude_systematics: ["EL.*", "MUON.*", "MET.*", "EG.*", "TAUS.*"] # Theory, PRW,JET and FT uncertainties

  # # which objects to create lorentz vectors for
  create_tlorentz_vectors_for: ["jet","mu","el","tau"]

  number_of_cpus: 1

  custom_options:
    # https://gitlab.cern.ch/atlas-phys/exot/lpx/exot-2022-34/taux_fastframes/-/blob/master/TauXFastFrame/TauXFastFrame/WorkingPointMap.h
    wpSet: "wpSet0" # LooseRNN
    # wpSet: "" 
    # wpElectron: "TightLH_Loose_VarRad"
    # wpMuon: "Loose_Loose_VarRad"
    # wpTau: "TightRNN"
    # presel_el: "el_select_TightLH_HighPtCaloOnly_NOSYS && el_pt_NOSYS > 10000" # tight electron id and high pt calo only iso
    presel_el: "el_select_TightLH_Loose_VarRad_NOSYS && el_pt_NOSYS > 10000" # tight electron id and high pt calo only iso
    presel_mu: "mu_select_Loose_Loose_VarRad_NOSYS && mu_pt_NOSYS > 10000"
    # presel_mu: "mu_select_Medium_Tight_VarRad_NOSYS && mu_pt_NOSYS > 10000"
    presel_tau: "tau_select_LooseRNN_noElVeto_NOSYS && tau_pt_NOSYS > 20000" 
    presel_jet: "abs(jet_eta) < 2.5 && jet_pt_NOSYS > 20000"
    # presel_el: ""
    # presel_mu: ""
    # presel_tau: "" 
    # presel_jet: ""



# define ntuples
ntuples:
  # regions: ["WCR_0tau1mu0b_NonRes", "WCR_0tau1e0b_NonRes"] 
  regions: ["SR_1tau0l1b_sch"] 
  # regions: ["SR_1tau0l_NonRes_looseNbjets"] 
  # samples: ["ttbar_nonallhad","ttbar_dilep", "Wlnu", "Wtaunu_METTAU", "Wtaunu_HF"]
  # samples: ["MU1500_gU1_5_23L0_2_hadtau", "MU2500_gU2_5_23L1_0_hadtau"]
  branches: ["eventNumber", "randomRunNumber", "weight_total_NOSYS", "jet_pt_NOSYS", "jet_select_wpSet0_NOSYS", "tauSF_NOSYS", "muonSF_NOSYS", "elSF_NOSYS", "lumi", "xSection", "jetSF_NOSYS", "weight_ftag_effSF_GN2v01_Continuous_NOSYS", "tau_0_pt", "tau_0_eta", "tau_0_phi", "tau_0_e", "MET_wpSet0_met_NOSYS", "jet_0_pt", "jet_0_eta", "jet_0_phi", "jet_0_e", "bJets85_pt_0_NOSYS", "bJets85_eta_0_NOSYS", "bJets85_phi_0_NOSYS", "nbJets85_NOSYS", "nbJets77_NOSYS", "nbJets90_NOSYS", "nbJets65_NOSYS", "nbJets70_NOSYS", "nJets_NOSYS","MET_wpSet0_phi_NOSYS","tau_truth_pt_vis","tau_truth_phi_vis","tau_truth_eta_vis", "tau_truth_m_vis", "tau_truth_origin","tau_truth_DecayMode","tau_truth_IsHadronicTau","PL_MET_met","PL_MET_phi","PL_nu_eta","PL_nu_phi","PL_nu_pt","PL_jet_eta","PL_jet_phi","PL_jet_pt","PL_jet_nGhosts_bHadron","PL_jet_nGhosts_cHadron","lepton_0_pt","lepton_0_eta","lepton_0_phi","lepton_0_isMu","lepton_0_isEl"]


# define cutflows
cutflows:
  - name: "SR_1tau0l1b_sch"
    samples: ["MU1500_gU1_5_23L0_6_noWeights_bsm", "MU3000_gU2_5_23L1_0_noWeights_bsm", "MU1500_gU1_5_23L0_6_noWeights_inf", "MU3000_gU2_5_23L1_0_noWeights_inf"]
    # samples: ["MU1500_gU1_5_23L0_6_noWeights_bsm", "MU3000_gU2_5_23L1_0_noWeights_bsm"]
    selections:
      - selection: "MET_NOSYS.met()*0.001 >= 0"
        title: "Total events with generator filter after derivation"
      - selection: "flag_MET_decision_NOSYS"
        title: "E_{T}^{miss} trigger"
      - selection: "MET_wpSet0_met_NOSYS*0.001 > 200"
        title: "E_{T}^{miss} > 200 GeV"
      - selection: "Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1"
        title: "N_{#tau} = 1"
      - selection: "Leptons_NOSYS.size() == 0"
        title: "N_{l} = 0"
      - selection: "flag_minDPhi_NOSYS"
        title: "QCD cleaning cut"
      - selection: "Taus_NOSYS[0].Pt() * 1e-3 > 200"
        title: "p_{T}^{#tau} > 200 GeV"
      - selection: "Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 200"
        title: "m_{T}^{#tau} > 200 GeV"
      - selection: "Jets_NOSYS.size() <= 4"
        title: "N_{jets} <= 4"
      - selection: "nbJets85_NOSYS == 1"
        title: "N_{b} = 1"
      - selection: "bJets85_pt_0_NOSYS * 1e-3 > 250"
        title: "p_{T}^{b} > 250 GeV"
      - selection: "Taus_NOSYS[0].InvM(bJets85_NOSYS[0]) * 0.001 > 800"
        title: "M_{b#tau} > 800 GeV"

  - name: "SR_1tau0l1b_tch"
    samples: ["MU1500_gU1_5_23L0_6_noWeights_bsm", "MU3000_gU2_5_23L1_0_noWeights_bsm", "MU1500_gU1_5_23L0_6_noWeights_inf", "MU3000_gU2_5_23L1_0_noWeights_inf"]
    # samples: ["MU1500_gU1_5_23L0_6_noWeights_bsm", "MU3000_gU2_5_23L1_0_noWeights_bsm"]
    selections:
      - selection: "MET_NOSYS.met()*0.001 >= 0"
        title: "Total events with generator filter after derivation"
      - selection: "flag_MET_decision_NOSYS"
        title: "E_{T}^{miss} trigger"
      - selection: "MET_wpSet0_met_NOSYS*0.001 > 400"
        title: "E_{T}^{miss} > 400 GeV"
      - selection: "Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1"
        title: "N_{#tau} = 1"
      - selection: "Leptons_NOSYS.size() == 0"
        title: "N_{l} = 0"
      - selection: "flag_minDPhi_NOSYS"
        title: "QCD cleaning cut"
      - selection: "Taus_NOSYS[0].Pt() * 1e-3 > 200"
        title: "p_{T}^{#tau} > 200 GeV"
      - selection: "Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 600"
        title: "m_{T}^{#tau} > 600 GeV"
      - selection: "abs(Taus_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2"
        title: "|#Delta#phi(#tau, E_{T}^{miss})| > 1.2"
      - selection: "Jets_NOSYS.size() <= 2"
        title: "N_{jets} <= 2"
      - selection: "nbJets85_NOSYS == 1"
        title: "N_{b} = 1"
      - selection: "bJets85_pt_0_NOSYS * 1e-3 < 250 && bJets85_pt_0_NOSYS * 1e-3 > 50"
        title: "p_{T}^{b} < 250 GeV && p_{T}^{b} > 50 GeV"

  - name: "SR_1tau0l0b_sch"
    samples: ["MU1500_gU1_5_23L0_6_noWeights_bsm", "MU3000_gU2_5_23L1_0_noWeights_bsm", "MU1500_gU1_5_23L0_6_noWeights_inf", "MU3000_gU2_5_23L1_0_noWeights_inf"]
    # samples: ["MU1500_gU1_5_23L0_6_noWeights_bsm", "MU3000_gU2_5_23L1_0_noWeights_bsm"]
    selections:
      - selection: "MET_NOSYS.met()*0.001 >= 0"
        title: "Total events with generator filter after derivation"
      - selection: "flag_MET_decision_NOSYS"
        title: "E_{T}^{miss} trigger"
      - selection: "MET_wpSet0_met_NOSYS*0.001 > 200"
        title: "E_{T}^{miss} > 200 GeV"
      - selection: "Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1"
        title: "N_{#tau} = 1"
      - selection: "Leptons_NOSYS.size() == 0"
        title: "N_{l} = 0"
      - selection: "flag_minDPhi_NOSYS"
        title: "QCD cleaning cut"
      - selection: "Taus_NOSYS[0].Pt() * 1e-3 > 200"
        title: "p_{T}^{#tau} > 200 GeV"
      - selection: "Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 200"
        title: "m_{T}^{#tau} > 200 GeV"
      - selection: "Jets_NOSYS.size() <= 4 && Jets_NOSYS.size() > 0"
        title: "N_{jets} <= 4 && N_{jets} > 0"
      - selection: "nbJets85_NOSYS == 0"
        title: "N_{b} = 0"
      - selection: "Jets_NOSYS[0].Pt() * 1e-3 > 250"
        title: "p_{T}^{leading jet} > 250 GeV"
      - selection: "Taus_NOSYS[0].InvM(Jets_NOSYS[0]) * 0.001 > 800"
        title: "M_{j#tau} > 800 GeV"

  - name: "SR_1tau0l0b_tch"
    samples: ["MU1500_gU1_5_23L0_6_noWeights_bsm", "MU3000_gU2_5_23L1_0_noWeights_bsm", "MU1500_gU1_5_23L0_6_noWeights_inf", "MU3000_gU2_5_23L1_0_noWeights_inf"]
    # samples: ["MU1500_gU1_5_23L0_6_noWeights_bsm", "MU3000_gU2_5_23L1_0_noWeights_bsm"]
    selections:
      - selection: "MET_NOSYS.met()*0.001 >= 0"
        title: "Total events with generator filter after derivation"
      - selection: "flag_MET_decision_NOSYS"
        title: "E_{T}^{miss} trigger"
      - selection: "MET_wpSet0_met_NOSYS*0.001 > 400"
        title: "E_{T}^{miss} > 400 GeV"
      - selection: "Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1"
        title: "N_{#tau} = 1"
      - selection: "Leptons_NOSYS.size() == 0"
        title: "N_{l} = 0"
      - selection: "flag_minDPhi_NOSYS"
        title: "QCD cleaning cut"
      - selection: "Taus_NOSYS[0].Pt() * 1e-3 > 200"
        title: "p_{T}^{#tau} > 200 GeV"
      - selection: "Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 600"
        title: "m_{T}^{#tau} > 600 GeV"
      - selection: "abs(Taus_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2"
        title: "|#Delta#phi(#tau, E_{T}^{miss})| > 1.2"
      - selection: "Jets_NOSYS.size() <= 2 && Jets_NOSYS.size() > 0"
        title: "N_{jets} <= 2 && N_{jets} > 0"
      - selection: "nbJets85_NOSYS == 0"
        title: "N_{b} = 0"
      - selection: "((Jets_NOSYS[0].Pt() * 1e-3 < 250 && Jets_NOSYS[0].Pt() * 1e-3 > 50) || (Jets_NOSYS.size() > 1 ? (Jets_NOSYS[1].Pt() * 1e-3 < 250 && Jets_NOSYS[1].Pt() * 1e-3 > 50) : 0))"
        title: "p_{T}^{jet} < 250 GeV && p_{T}^{jet} > 50 GeV"
      - selection: "Jets_NOSYS[0].Pt() * 1e-3 < 250 && Jets_NOSYS[0].Pt() * 1e-3 > 50"
        title: "p_{T}^{leading jet} < 250 GeV && p_{T}^{leading jet} > 50 GeV"



# define regions
regions:
  - name: "SR_1tau0l1b_sch"
    selection: "flag_MET_decision_NOSYS && Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1 && Leptons_NOSYS.size() == 0 && nbJets85_NOSYS == 1 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 200 && Taus_NOSYS[0].Pt() * 1e-3 > 200 && Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 200 && Taus_NOSYS[0].InvM(bJets85_NOSYS[0]) * 0.001 > 800 && Jets_NOSYS.size() <= 4 && bJets85_pt_0_NOSYS * 1e-3 > 250"
    variables: &var_taunub
      - name: "met"
        title : ";E_{T}^{miss} [GeV];Events"
        definition: "MET_wpSet0_met_NOSYS * 0.001"
        type: "double"
        binning:
          bin_edges: [0, 10000]
          # min: 0
          # max: 1500
          # number_of_bins: 15
  - name: "SR_1tau0l1b_tch"
    selection: "flag_MET_decision_NOSYS && Taus_NOSYS.size() == 1 && Taus_NOSYS[0].select_TightRNN_NOSYS() == 1 && Leptons_NOSYS.size() == 0 && nbJets85_NOSYS == 1 && flag_minDPhi_NOSYS && MET_wpSet0_met_NOSYS * 1e-3 > 400 && Taus_NOSYS[0].Pt() * 1e-3 > 200 && Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 > 600 && abs(Taus_NOSYS[0].DeltaPhi(MET_NOSYS)) > 1.2 && Jets_NOSYS.size() <= 2 && bJets85_pt_0_NOSYS * 1e-3 < 250 && bJets85_pt_0_NOSYS * 1e-3 > 50"
