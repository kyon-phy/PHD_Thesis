      - name: "met"
        title : ";E_{T}^{miss} [GeV];Events"
        definition: "MET_wpSet0_met_NOSYS * 0.001"
        type: "double"
        binning:
          min: 0
          max: 3000
          number_of_bins: 30
      - name: "mT_tau_met"
        title : ";m_{T}(#tau, met) [GeV];Events"
        definition: "Taus_NOSYS.size()>0 ? Taus_NOSYS[0].mT(MET_NOSYS) * 0.001 : 0"
        type: "double"
        binning:
          min: 0
          max: 3000
          number_of_bins: 30
      - name: "tau_pt_0"
        title : ";p_{T}^{#tau} [GeV];Events"
        definition: "Taus_NOSYS.size()>0 ? Taus_NOSYS[0].Pt() * 1e-3 : 0"
        type: "double"
        binning:
          min: 0
          max: 3000
          number_of_bins: 30
      - name: "lep_pt_0"
        title : ";p_{T}^{l} [GeV];Events"
        definition: "Leptons_NOSYS.size()>0 ? Leptons_NOSYS[0].Pt() * 1e-3 : 0"
        type: "double"
        binning:
          min: 0
          max: 3000
          number_of_bins: 30
      - name: "bjet_pt_0"
        title : ";p_{T}^{b} [GeV];Events"
        definition: "bJets85_NOSYS.size()>0 ? bJets85_pt_0_NOSYS * 1e-3 : 0"
        type: "double"
        binning:
          bin_edges: [0., 50., 100., 150., 250., 300., 400., 500., 700., 800., 1000., 1200., 1500., 1800., 2100., 2500., 3000.]
      - name: "Mtaub"
        title : ";leading m_{#tau+b} [GeV];Events"
        definition: "Taus_NOSYS[0].InvM(bJets85_NOSYS[0]) * 1e-3"
        type: "double"
        binning:
          min: 0
          max: 3000
          number_of_bins: 30
      - name: "dphi_taumet"
        title : ";#Delta#phi(tau, met);Events"
        definition: "Taus_NOSYS.size()>0 ? abs(Taus_NOSYS[0].DeltaPhi(MET_NOSYS)) : 0"
        type: "double"
        binning:
          min: 0
          max: 3.2
          number_of_bins: 16
